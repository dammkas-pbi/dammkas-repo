<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌸 Dzień Kobiet - Nati 🌸</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Great+Vibes&family=Quicksand:wght@300;400;500;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a0612;font-family:'Quicksand',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}

/* ===== WELCOME SCREEN ===== */
#welcome-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 30% 40%,#2a0a3e 0%,#12061e 50%,#0a0612 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;cursor:pointer;transition:opacity 1.4s ease}
#welcome-screen.hidden{opacity:0;pointer-events:none}
.welcome-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,8vw,4.5rem);color:#f4c2c2;text-align:center;margin-bottom:0.1em;opacity:0;animation:fadeUp 1.5s ease 0.3s forwards;text-shadow:0 0 60px rgba(244,150,180,0.25),0 2px 4px rgba(0,0,0,0.3);line-height:1.2;font-weight:300;letter-spacing:0.02em;padding:0 20px}
.welcome-name{font-family:'Great Vibes',cursive;font-size:clamp(2.8rem,11vw,6rem);color:#f0a0b8;text-align:center;opacity:0;animation:fadeUp 1.5s ease 0.7s forwards;text-shadow:0 0 50px rgba(240,160,184,0.35),0 0 100px rgba(240,120,160,0.15),0 2px 4px rgba(0,0,0,0.2);letter-spacing:0.03em;margin-bottom:0.2em}
.welcome-sub{font-family:'Quicksand',sans-serif;font-size:clamp(0.9rem,3.5vw,1.4rem);color:rgba(255,200,200,0.65);text-align:center;opacity:0;animation:fadeUp 1.5s ease 0.8s forwards;letter-spacing:0.15em;font-weight:300}
.welcome-tap{position:absolute;bottom:12%;font-size:clamp(0.7rem,2.2vw,0.9rem);color:rgba(255,180,200,0.4);opacity:0;animation:fadeUp 1.5s ease 1.5s forwards,pulse 2.5s ease-in-out 2.5s infinite;letter-spacing:0.25em;text-transform:uppercase;font-weight:300}

/* ===== FLOATING FLOWERS ===== */
.floating-flowers{position:absolute;width:100%;height:100%;overflow:hidden;pointer-events:none}
.flower-particle{position:absolute;font-size:1.2rem;opacity:0;animation:floatFlower 7s ease-in infinite}
@keyframes floatFlower{0%{transform:translateY(100vh) rotate(0deg) scale(0.4);opacity:0}8%{opacity:0.5}85%{opacity:0.25}100%{transform:translateY(-10vh) rotate(360deg) scale(1.1);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:0.35;transform:scale(1)}50%{opacity:0.7;transform:scale(1.05)}}

/* ===== HINT TEXT ===== */
#hint-text{position:fixed;bottom:7%;left:50%;transform:translateX(-50%);font-family:'Quicksand',sans-serif;font-size:clamp(0.8rem,2.8vw,1.1rem);color:rgba(255,200,210,0.75);text-align:center;z-index:20;pointer-events:none;opacity:0;transition:opacity 0.8s ease;text-shadow:0 0 20px rgba(255,100,150,0.2);letter-spacing:0.05em;max-width:85%;line-height:1.5;font-weight:300}
#hint-text.visible{opacity:1}

/* ===== STAGE INDICATOR ===== */
#stage-indicator{position:fixed;top:5%;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:20;opacity:0;transition:opacity 0.8s ease}
#stage-indicator.visible{opacity:1}
.stage-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,180,200,0.15);border:1px solid rgba(255,180,200,0.3);transition:all 0.5s ease}
.stage-dot.active{background:#f4c2c2;box-shadow:0 0 14px rgba(244,194,194,0.5);transform:scale(1.4)}
.stage-dot.done{background:rgba(244,194,194,0.45)}

/* ===== MODAL ===== */
#modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(5,2,10,0.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity 0.6s ease;padding:20px}
#modal.visible{opacity:1;pointer-events:all}
#modal-content{max-width:380px;width:92%;text-align:center}
#modal-image{width:100%;max-width:300px;max-height:45vh;object-fit:cover;border-radius:18px;box-shadow:0 20px 60px rgba(200,100,150,0.25),0 0 0 1px rgba(255,180,200,0.1);margin-bottom:20px;opacity:0;transform:scale(0.85) translateY(20px);transition:all 0.8s cubic-bezier(0.34,1.56,0.64,1)}
#modal.visible #modal-image{opacity:1;transform:scale(1) translateY(0);transition-delay:0.3s}
#modal-text{font-family:'Cormorant Garamond',serif;font-size:clamp(1.1rem,4vw,1.5rem);color:#f4c2c2;margin-bottom:28px;opacity:0;transform:translateY(15px);transition:all 0.6s ease;line-height:1.6;font-weight:300;font-style:italic}
#modal.visible #modal-text{opacity:1;transform:translateY(0);transition-delay:0.6s}
#modal-close{font-family:'Quicksand',sans-serif;padding:12px 40px;border:1px solid rgba(244,194,194,0.3);background:rgba(244,194,194,0.08);color:#f4c2c2;border-radius:30px;font-size:0.9rem;cursor:pointer;letter-spacing:0.12em;transition:all 0.3s ease;opacity:0;transform:translateY(10px);font-weight:400}
#modal.visible #modal-close{opacity:1;transform:translateY(0);transition-delay:0.9s}
#modal-close:hover,#modal-close:active{background:rgba(244,194,194,0.2);transform:scale(1.05);box-shadow:0 0 20px rgba(244,194,194,0.15)}

/* ===== FINAL SCREEN ===== */
#final-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 40%,#1a0a2e 0%,#0a0612 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:80;opacity:0;pointer-events:none;transition:opacity 1.5s ease;padding:20px}
#final-screen.visible{opacity:1;pointer-events:all}
.final-emoji{font-size:clamp(3rem,12vw,5rem);margin-bottom:20px;opacity:0}
#final-screen.visible .final-emoji{animation:fadeUp 1s ease 0.3s forwards,floatGentle 3s ease-in-out 1.3s infinite}
.final-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,7vw,3.5rem);color:#f4c2c2;text-align:center;margin-bottom:16px;opacity:0;line-height:1.3;font-weight:300;text-shadow:0 0 40px rgba(244,150,180,0.2)}
#final-screen.visible .final-title{animation:fadeUp 1s ease 0.6s forwards}
.final-text{font-family:'Quicksand',sans-serif;font-size:clamp(1rem,3.5vw,1.3rem);color:rgba(255,200,210,0.7);text-align:center;max-width:400px;line-height:1.7;opacity:0;font-weight:300}
#final-screen.visible .final-text{animation:fadeUp 1s ease 1s forwards}
@keyframes floatGentle{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ===== TULIP ADMIRE HINT ===== */
#tulip-hint{position:fixed;bottom:7%;left:50%;transform:translateX(-50%);font-family:'Quicksand',sans-serif;font-size:clamp(0.75rem,2.5vw,1rem);color:rgba(255,200,210,0.5);text-align:center;z-index:20;pointer-events:none;opacity:0;transition:opacity 1s ease;letter-spacing:0.08em;font-weight:300;max-width:85%}
#tulip-hint.visible{opacity:1}

.sparkle-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
</style>
</head>
<body>

<!-- Welcome Screen -->
<div id="welcome-screen">
  <div class="floating-flowers" id="floating-flowers"></div>
  <div class="welcome-title">Wszystkiego Najlepszego<br>z okazji Dnia Kobiet! 🌷</div>
  <div class="welcome-name">Nati</div>
  <div class="welcome-tap">dotknij, aby zacząć</div>
</div>

<!-- Stage dots -->
<div id="stage-indicator">
  <div class="stage-dot active" data-stage="0"></div>
  <div class="stage-dot" data-stage="1"></div>
</div>

<!-- Hint text -->
<div id="hint-text"></div>

<!-- Tulip admire hint (shown after flowers grow) -->
<div id="tulip-hint">dotknij ekran, aby przejść dalej</div>

<!-- Modal for kitten -->
<div id="modal">
  <div id="modal-content">
    <img id="modal-image" src="" alt="Słodki kotek">
    <div id="modal-text"></div>
    <button id="modal-close">Dalej ✨</button>
  </div>
</div>

<!-- Final Screen -->
<div id="final-screen">
  <div class="floating-flowers" id="final-flowers"></div>
  <div class="final-emoji">🌷</div>
  <div class="final-title">Miłego Dnia Kobiet!</div>
  <div class="final-text"></div>
</div>

<canvas class="sparkle-canvas" id="sparkle-canvas"></canvas>

// ===== WELCOME FLOWERS =====
function createFloatingFlowers(containerId, count = 15) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const flowers = ['🌸','🌺','🌻','🌼','🌷','🌹','🪷','✨','💐'];
  for (let i = 0; i < count; i++) {
    const f = document.createElement('div');
    f.className = 'flower-particle';
    f.textContent = flowers[Math.floor(Math.random() * flowers.length)];
    f.style.left = Math.random() * 100 + '%';
    f.style.animationDelay = Math.random() * 7 + 's';
    f.style.animationDuration = (5 + Math.random() * 4) + 's';
    container.appendChild(f);
  }
}
createFloatingFlowers('floating-flowers');
createFloatingFlowers('final-flowers', 20);

    document.getElementById('stage-indicator').classList.add('visible');
    startScene();
  }, 1400);
});

// ===== THREE.JS SETUP =====
function initThree() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0612, 0.035);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 2.8, 6.5);
  camera.lookAt(0, 0.5, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.prepend(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffc0cb, 0.4));
  const mainLight = new THREE.DirectionalLight(0xffeedd, 1.0);
  mainLight.position.set(3, 8, 5);
  mainLight.castShadow = true;
  mainLight.shadow.mapSize.set(1024, 1024);
  scene.add(mainLight);
  const pinkLight = new THREE.PointLight(0xff69b4, 0.8, 15);
  pinkLight.position.set(-3, 4, 2);
  scene.add(pinkLight);
  const warmLight = new THREE.PointLight(0xffaa55, 0.5, 12);
  warmLight.position.set(3, 3, -1);
  scene.add(warmLight);

  // Floor
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(10, 64),
    new THREE.MeshStandardMaterial({ color: 0x1a0a2e, roughness: 0.8, metalness: 0.1 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Background particles
  const pCount = 250;
  const pGeom = new THREE.BufferGeometry();
  const pos = new Float32Array(pCount * 3);
  for (let i = 0; i < pCount; i++) {
    pos[i*3] = (Math.random()-0.5)*20;
    pos[i*3+1] = Math.random()*10;
    pos[i*3+2] = (Math.random()-0.5)*20-5;
  }
  pGeom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const particles = new THREE.Points(pGeom, new THREE.PointsMaterial({ color: 0xf4c2c2, size: 0.03, transparent: true, opacity: 0.5 }));
  scene.add(particles);
  objects3D.particles = particles;

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  // Water drops
  dropGeom = new THREE.SphereGeometry(0.06, 8, 8);
  dropMat = new THREE.MeshStandardMaterial({ color: 0x4499ff, transparent: true, opacity: 0.85, roughness: 0.1, metalness: 0.2 });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ===== CREATE TULIP =====
function createTulip(color, h = 1.8, bs = 1) {
  const g = new THREE.Group();

  // Stem
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(0.02,h*0.3,0.01),
    new THREE.Vector3(-0.01,h*0.65,-0.01),
    new THREE.Vector3(0,h,0)
  ]);
  const stem = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 20, 0.035, 8, false),
    new THREE.MeshStandardMaterial({ color: 0x2d7a3a, roughness: 0.7 })
  );
  stem.castShadow = true;
  g.add(stem);

  // Leaves
  for (let s of [-1, 1]) {
    const ls = new THREE.Shape();
    ls.moveTo(0,0);
    ls.quadraticCurveTo(0.18*s, 0.3, 0.08*s, 0.55);
    ls.quadraticCurveTo(0.02*s, 0.35, 0, 0.12);
    const lm = new THREE.Mesh(
      new THREE.ShapeGeometry(ls),
      new THREE.MeshStandardMaterial({ color: 0x358840, side: THREE.DoubleSide, roughness: 0.6 })
    );
    lm.position.y = h * 0.12;
    lm.rotation.z = s * 0.25;
    g.add(lm);
  }

  // Bud / petals
  const bud = new THREE.Group();
  bud.position.y = h;
  const pc = 7;
  for (let i = 0; i < pc; i++) {
    const angle = (i/pc) * Math.PI * 2;
    const inner = i % 2 === 0;
    const pH = 0.4 * bs, pW = 0.2 * bs;
    const ps = new THREE.Shape();
    ps.moveTo(0,0);
    ps.bezierCurveTo(-pW, pH*0.3, -pW*0.8, pH*0.85, 0, pH);
    ps.bezierCurveTo(pW*0.8, pH*0.85, pW, pH*0.3, 0, 0);
    const shade = new THREE.Color(color);
    if (inner) shade.multiplyScalar(0.88);
    const pm = new THREE.Mesh(
      new THREE.ShapeGeometry(ps, 8),
      new THREE.MeshStandardMaterial({ color: shade, side: THREE.DoubleSide, roughness: 0.4, metalness: 0.05 })
    );
    pm.castShadow = true;
    const rad = inner ? 0.04*bs : 0.08*bs;
    pm.position.set(Math.sin(angle)*rad, 0, Math.cos(angle)*rad);
    pm.rotation.y = angle;
    pm.rotation.x = inner ? 0.3 : 0.5;
    bud.add(pm);
  }
  bud.add(new THREE.Mesh(new THREE.SphereGeometry(0.03*bs,8,8), new THREE.MeshStandardMaterial({ color: 0xffe066 })));
  g.add(bud);
  g.userData.bud = bud;
  return g;
}

// ===== CREATE DIRT =====
function createDirt() {
  const mesh = new THREE.Mesh(
    new THREE.CircleGeometry(1.4, 32),
    new THREE.MeshStandardMaterial({ color: 0x3a2318, roughness: 1 })
  );
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = 0.01;
  mesh.receiveShadow = true;
  return mesh;
}

// ===== CREATE WATERING CAN =====
function createWateringCan() {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x88ccff, roughness: 0.4, metalness: 0.1 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x5599cc, roughness: 0.5 });

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.9, 32), mat);
  body.position.y = 0.45; body.castShadow = true; group.add(body);

  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.05, 16, 32, Math.PI), mat);
  handle.position.set(0, 0.9, 0); group.add(handle);

  const sideHandle = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.05, 16, 32, Math.PI), mat);
  sideHandle.position.set(-0.45, 0.45, 0); sideHandle.rotation.z = Math.PI/2; group.add(sideHandle);

  const spout = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.07, 0.7, 16), mat);
  spout.position.set(0.55, 0.4, 0); spout.rotation.z = -Math.PI/3; group.add(spout);

  const rose = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.06, 0.1, 16), darkMat);
  rose.position.set(0.85, 0.58, 0); rose.rotation.z = -Math.PI/3; group.add(rose);

  const spoutPoint = new THREE.Object3D();
  spoutPoint.position.set(0.85, 0.58, 0);
  group.add(spoutPoint);
  group.userData.spoutPoint = spoutPoint;
  group.userData.type = 'wateringCan';
  group.userData.clickable = true;
  return group;
}

// ===== CREATE GIFT BOX =====
function createGiftBox(color, ribbonColor, size = 1) {
  const group = new THREE.Group();
  const boxMat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.15 });

  const box = new THREE.Mesh(new THREE.BoxGeometry(1.2*size, 0.9*size, 1.2*size), boxMat);
  box.position.y = 0.45*size; box.castShadow = true; box.receiveShadow = true; group.add(box);

  const lid = new THREE.Mesh(new THREE.BoxGeometry(1.3*size, 0.15*size, 1.3*size), boxMat.clone());
  lid.position.y = 0.95*size; lid.castShadow = true; group.add(lid);
  group.userData.lid = lid;

  const ribbonMat = new THREE.MeshStandardMaterial({ color: ribbonColor, roughness: 0.25, metalness: 0.4 });
  const rv = new THREE.Mesh(new THREE.BoxGeometry(0.12*size, 0.92*size, 1.22*size), ribbonMat);
  rv.position.y = 0.46*size; group.add(rv);
  const rh = new THREE.Mesh(new THREE.BoxGeometry(1.22*size, 0.92*size, 0.12*size), ribbonMat);
  rh.position.y = 0.46*size; group.add(rh);

  const bowGeom = new THREE.TorusGeometry(0.18*size, 0.05*size, 8, 16);
  const bow1 = new THREE.Mesh(bowGeom, ribbonMat);
  bow1.position.set(-0.15*size, 1.1*size, 0); bow1.rotation.y = Math.PI/4; group.add(bow1);
  const bow2 = new THREE.Mesh(bowGeom, ribbonMat);
  bow2.position.set(0.15*size, 1.1*size, 0); bow2.rotation.y = -Math.PI/4; group.add(bow2);

  const sparkle = new THREE.PointLight(ribbonColor, 0, 5);
  sparkle.position.set(0, 1.5*size, 0); group.add(sparkle);
  group.userData.sparkle = sparkle;
  group.userData.type = 'giftbox';
  group.userData.clickable = true;
  group.userData.opened = false;
  group.scale.set(0,0,0);
  return group;
}

// ===== SPARKLE CANVAS =====
const sparkleCanvas = document.getElementById('sparkle-canvas');
const sparkleCtx = sparkleCanvas.getContext('2d');
let sparkles = [];

function resizeSparkleCanvas() {
  sparkleCanvas.width = window.innerWidth;
  sparkleCanvas.height = window.innerHeight;
}
resizeSparkleCanvas();
window.addEventListener('resize', resizeSparkleCanvas);

function addSparkles(cx, cy, count = 30) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    sparkles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 1, decay: 0.01 + Math.random() * 0.02,
      size: 2 + Math.random() * 4,
      color: ['#f4c2c2','#ff69b4','#ffd700','#fff','#ff8fab','#e879a0'][Math.floor(Math.random()*6)]
    });
  }
}

function updateSparkles() {
  sparkleCtx.clearRect(0, 0, sparkleCanvas.width, sparkleCanvas.height);
  sparkles = sparkles.filter(s => s.life > 0);
  sparkles.forEach(s => {
    s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.life -= s.decay;
    sparkleCtx.globalAlpha = Math.max(0, s.life);
    sparkleCtx.fillStyle = s.color;
    sparkleCtx.beginPath();
    sparkleCtx.arc(s.x, s.y, Math.max(0.1, s.size * s.life), 0, Math.PI*2);
    sparkleCtx.fill();
  });
  sparkleCtx.globalAlpha = 1;
}

// ===== UI HELPERS =====
function showHint(text) {
  const el = document.getElementById('hint-text');
  el.textContent = text;
  el.classList.add('visible');
}
function hideHint() { document.getElementById('hint-text').classList.remove('visible'); }

function updateStageDots() {
  document.querySelectorAll('.stage-dot').forEach((dot, i) => {
    dot.classList.remove('active','done');
    if (i === currentStage) dot.classList.add('active');
    else if (i < currentStage) dot.classList.add('done');
  });
}

// ===== ANIMATION HELPERS =====
function animateScale(obj, target, duration, delay = 0, easing = 'elastic') {
  const start = { x: obj.scale.x, y: obj.scale.y, z: obj.scale.z };
  const startTime = Date.now() + delay;
  function update() {
    const elapsed = Date.now() - startTime;
    if (elapsed < 0) { requestAnimationFrame(update); return; }
    let t = Math.min(elapsed / duration, 1);
    if (easing === 'elastic') t = t === 1 ? 1 : -Math.pow(2, -10*t) * Math.sin((t*10-0.75)*(2*Math.PI)/3) + 1;
    else t = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
    const v = start.x + (target - start.x) * t;
    obj.scale.set(v, v, v);
    if (elapsed < duration) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

function animatePosition(obj, target, duration, delay = 0) {
  const start = { x: obj.position.x, y: obj.position.y, z: obj.position.z };
  const startTime = Date.now() + delay;
  function update() {
    const elapsed = Date.now() - startTime;
    if (elapsed < 0) { requestAnimationFrame(update); return; }
    let t = Math.min(elapsed / duration, 1);
    t = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
    obj.position.set(
      start.x + (target.x - start.x) * t,
      start.y + (target.y - start.y) * t,
      start.z + (target.z - start.z) * t
    );
    if (elapsed < duration) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

// ===== CLEAR SCENE =====
function clearSceneObjects() {
  ['wateringCan','dirt','giftBox1','tulipGroup'].forEach(key => {
    if (objects3D[key]) { scene.remove(objects3D[key]); objects3D[key] = null; }
  });
  // Clean up water drops
  waterDrops.forEach(d => scene.remove(d));
  waterDrops = [];
}

// ===== STAGE 0: FLOWERS =====
function setupFlowerStage() {
  clearSceneObjects();
  camera.position.set(0, 3, 6.5);
  camera.lookAt(0, 0.5, 0);

  const dirt = createDirt();
  scene.add(dirt);
  objects3D.dirt = dirt;

  const can = createWateringCan();
  can.position.set(-1.8, 0, 1.2);
  can.scale.set(0,0,0);
  scene.add(can);
  objects3D.wateringCan = can;
  animateScale(can, 1.2, 1000, 300, 'elastic');

  showHint('Dotknij konewki, aby podlać ziemię 🌱');

  // Create tulips (hidden)
  const tg = new THREE.Group();
  const cols = [0xff4d6d, 0xff6b8a, 0xff8fab, 0xf472b6, 0xfb7185, 0xff3366, 0xe8457a];
  const positions = [[0,0,0],[-0.3,0,0.2],[0.3,0,0.15],[-0.15,0,-0.3],[0.2,0,-0.2],[0.1,0,0.3],[-0.25,0,-0.1]];
  positions.forEach((pos, i) => {
    const t = createTulip(cols[i%cols.length], 1.2+Math.random()*0.5, 0.7+Math.random()*0.3);
    t.position.set(pos[0]*1.4, 0, pos[2]*1.4);
    t.rotation.set((Math.random()-0.5)*0.3, Math.random()*Math.PI, (Math.random()-0.5)*0.3);
    tg.add(t);
  });
  tg.position.set(0, -0.8, 0);
  tg.scale.set(0.01, 0.01, 0.01);
  scene.add(tg);
  objects3D.tulipGroup = tg;
}

// ===== STAGE 1: KITTEN BOX =====
function setupKittenStage() {
  clearSceneObjects();
  camera.position.set(0, 2.5, 5.5);
  camera.lookAt(0, 1, 0);

  const box = createGiftBox(0xff69b4, 0xffd700, 1.1);
  box.position.set(0, 0, 0);
  scene.add(box);
  objects3D.giftBox1 = box;
  animateScale(box, 1, 1000, 400, 'elastic');
  showHint('Dotknij pudełka, by je otworzyć 🎁');
}

// ===== WATERING ANIMATION =====
function handleWateringCanClick(can) {
  isTransitioning = true;
  hideHint();
  can.userData.opened = true;

  // Move can above dirt
  animatePosition(can, {x:-1.2, y:1.5, z:0}, 800);

  setTimeout(() => {
    // Tilt
    const targetRot = -Math.PI / 3.5;
    let startT = Date.now();
    const tiltAnim = () => {
      let p = Math.min((Date.now()-startT)/500, 1);
      can.rotation.z = targetRot * p;
      if (p < 1) requestAnimationFrame(tiltAnim);
      else {
        // Start watering
        isWatering = true;
        setTimeout(() => {
          isWatering = false;

          // Return upright
          let startT2 = Date.now();
          const returnAnim = () => {
            let p2 = Math.min((Date.now()-startT2)/500, 1);
            can.rotation.z = targetRot * (1-p2);
            if (p2 < 1) requestAnimationFrame(returnAnim);
            else {
              // Fade out can
              animateScale(can, 0, 600, 0, 'ease');
              animateScale(objects3D.dirt, 0, 1200, 400, 'ease');
            }
          };
          returnAnim();

          // Grow tulips!
          const tg = objects3D.tulipGroup;
          if (tg) {
            animateScale(tg, 1.4, 2500, 0, 'elastic');
            animatePosition(tg, {x:0, y:0.05, z:0}, 2000);

            setTimeout(() => {
              const rect = renderer.domElement.getBoundingClientRect();
              addSparkles(rect.width/2, rect.height/2, 80);
            }, 800);
          }

          // After flowers finish growing, allow user to admire them
          setTimeout(() => {
            isAdmiringTulips = true;
            isTransitioning = false;
            document.getElementById('tulip-hint').classList.add('visible');
          }, 3000);

        }, 2000); // Watering duration
      }
    };
    tiltAnim();
  }, 800);
}

// ===== HANDLE TAP DURING TULIP ADMIRING =====
function handleTulipAdmireTap() {
  if (!isAdmiringTulips) return;
  isAdmiringTulips = false;
  isTransitioning = true;
  document.getElementById('tulip-hint').classList.remove('visible');

  currentStage = 1;
  updateStageDots();

  const tg = objects3D.tulipGroup;
  if (tg) animateScale(tg, 0, 600, 0, 'ease');

  setTimeout(() => {
    setupKittenStage();
    isTransitioning = false;
  }, 700);
}

// ===== OPEN BOX =====
function openBox(boxObj, callback) {
  if (boxObj.userData.opened) return;
  boxObj.userData.opened = true;

  const lid = boxObj.userData.lid;
  const sparkle = boxObj.userData.sparkle;

  let t2 = 0;
  const lightUp = () => {
    t2 += 0.03;
    if (sparkle) sparkle.intensity = Math.sin(t2 * Math.PI) * 3;
    if (t2 < 1) requestAnimationFrame(lightUp);
  };
  lightUp();

  const startTime = Date.now();
  const duration = 800;
  const anim = () => {
    const elapsed = Date.now() - startTime;
    let p = Math.min(elapsed / duration, 1);
    p = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2;
    lid.position.y = 0.95 + p * 2;
    lid.position.z = p * -1.5;
    lid.rotation.x = p * -Math.PI * 0.6;
    if (elapsed < duration) requestAnimationFrame(anim);
    else setTimeout(callback, 100);
  };
  anim();

  const rect = renderer.domElement.getBoundingClientRect();
  addSparkles(rect.width/2, rect.height/2, 60);
}

// ===== MODAL =====
function showModal(imageSrc, text, onClose) {
  const modal = document.getElementById('modal');
  const img = document.getElementById('modal-image');
  const txt = document.getElementById('modal-text');
  img.src = imageSrc;
  txt.textContent = text;
  modal.classList.add('visible');

  const closeBtn = document.getElementById('modal-close');
  const handler = () => {
    modal.classList.remove('visible');
    closeBtn.removeEventListener('click', handler);
    setTimeout(onClose, 600);
  };
  closeBtn.addEventListener('click', handler);
}

// ===== INTERACTION =====
function onInteract(event) {
  // If admiring tulips, any tap advances
  if (isAdmiringTulips) {
    handleTulipAdmireTap();
    return;
  }

  if (isTransitioning) return;

  const rect = renderer.domElement.getBoundingClientRect();
  const clientX = event.touches ? event.touches[0].clientX : event.clientX;
  const clientY = event.touches ? event.touches[0].clientY : event.clientY;

  mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const allObjects = [];
  scene.traverse(child => { if (child.isMesh) allObjects.push(child); });
  const intersects = raycaster.intersectObjects(allObjects, false);
  if (intersects.length === 0) return;

  let clickedObj = intersects[0].object;
  while (clickedObj && !clickedObj.userData.clickable) clickedObj = clickedObj.parent;
  if (!clickedObj || !clickedObj.userData.clickable) return;

  addSparkles(clientX, clientY, 20);

  if (currentStage === 0 && clickedObj.userData.type === 'wateringCan' && !clickedObj.userData.opened) {
    handleWateringCanClick(clickedObj);
  } else if (currentStage === 1 && clickedObj.userData.type === 'giftbox' && !clickedObj.userData.opened) {
    handleKittenBoxClick(clickedObj);
  }
}

function handleKittenBoxClick(box) {
  isTransitioning = true;
  hideHint();
  openBox(box, () => {
    showModal(KITTEN_IMAGE_SRC, CONFIG.kittenMessage, () => {
      showFinalScreen();
    });
  });
}

function showFinalScreen() {
  document.getElementById('stage-indicator').classList.remove('visible');
  hideHint();
  if (objects3D.giftBox1) animateScale(objects3D.giftBox1, 0, 800, 0, 'ease');

  setTimeout(() => {
    document.getElementById('final-screen').classList.add('visible');
    const w = window.innerWidth, h = window.innerHeight;
    for (let i = 0; i < 6; i++) {
      setTimeout(() => addSparkles(Math.random()*w, Math.random()*h, 35), i*300);
    }
  }, 600);
}

// ===== MAIN LOOP =====
function animate() {
  requestAnimationFrame(animate);
  time += 0.016;

  // Gift box idle animation
  const box = objects3D.giftBox1;
  if (box && box.scale.x > 0 && !box.userData.opened) {
    box.rotation.y = Math.sin(time * 0.7) * 0.15;
    box.position.y = Math.sin(time * 1.2) * 0.06;
    if (box.userData.sparkle) box.userData.sparkle.intensity = 0.3 + Math.sin(time*3) * 0.3;
  }

  // Watering can hover
  if (objects3D.wateringCan && objects3D.wateringCan.scale.x > 0 && !isTransitioning && currentStage === 0 && !objects3D.wateringCan.userData.opened) {
    objects3D.wateringCan.position.y = Math.sin(time * 1.5) * 0.05;
    objects3D.wateringCan.rotation.y = Math.sin(time * 0.8) * 0.1;
  }

  // Water drops
  if (isWatering && objects3D.wateringCan) {
    const spoutPt = objects3D.wateringCan.userData.spoutPoint;
    const worldPos = new THREE.Vector3();
    spoutPt.getWorldPosition(worldPos);
    for (let i = 0; i < 3; i++) {
      const drop = new THREE.Mesh(dropGeom, dropMat);
      drop.position.copy(worldPos);
      drop.position.x += (Math.random()-0.5)*0.15;
      drop.position.z += (Math.random()-0.5)*0.15;
      drop.userData.vy = -0.06 - Math.random()*0.05;
      drop.userData.vx = (Math.random()-0.5)*0.03;
      drop.userData.vz = (Math.random()-0.5)*0.03;
      scene.add(drop);
      waterDrops.push(drop);
    }
  }
  for (let i = waterDrops.length-1; i >= 0; i--) {
    const d = waterDrops[i];
    d.position.y += d.userData.vy;
    d.position.x += d.userData.vx;
    d.position.z += d.userData.vz;
    d.userData.vy -= 0.005;
    if (d.position.y < 0) { scene.remove(d); waterDrops.splice(i,1); }
  }

  // Tulip sway
  if (objects3D.tulipGroup && objects3D.tulipGroup.scale.x > 0.1) {
    objects3D.tulipGroup.rotation.y = Math.sin(time*0.5)*0.1;
    objects3D.tulipGroup.children.forEach((t, i) => {
      t.rotation.z = Math.sin(time*0.8 + i)*0.04;
      if (t.userData.bud) t.userData.bud.rotation.z = Math.sin(time + i)*0.03;
    });
  }

  if (objects3D.particles) objects3D.particles.rotation.y = time * 0.02;

  updateSparkles();
  renderer.render(scene, camera);
}

// ===== START =====
function startScene() {
  initThree();
  setupFlowerStage();

  renderer.domElement.addEventListener('click', onInteract);
  renderer.domElement.addEventListener('touchstart', (e) => {
    e.preventDefault();
    onInteract(e);
  }, { passive: false });

  animate();
}
